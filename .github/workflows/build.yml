name: Build LoveSync APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Lay code tu repo
        uses: actions/checkout@v4

      - name: Cai Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cai Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Kiem tra cau truc project
        run: |
          echo "--- pubspec.yaml ---"
          cat pubspec.yaml
          for f in android/settings.gradle.kts android/build.gradle.kts \
                   android/app/build.gradle.kts android/app/src/main/AndroidManifest.xml; do
            [ -f "$f" ] || { echo "::error::Thieu file $f - hay upload day du thu muc android/"; exit 1; }
          done
          if [ -f android/app/lovesync.jks ] && [ -f android/key.properties ]; then
            echo "Co khoa ky co dinh -> APK moi se cai de len ban cu duoc."
          else
            echo "::warning::Thieu android/app/lovesync.jks hoac android/key.properties."
            echo "::warning::APK se duoc ky bang debug key sinh moi moi lan build,"
            echo "::warning::nghia la KHONG cai de len ban cu duoc va se mat du lieu."
          fi
          echo "Cau truc android/ day du."

      - name: Tao Gradle wrapper (file .jar khong duoc commit)
        run: |
          # Sinh wrapper o thu muc TRONG, khong chay trong android/.
          # Neu chay trong android/ thi Gradle se doc settings.gradle.kts,
          # file nay can local.properties - ma chi Flutter moi tao ra luc build.
          mkdir -p /tmp/wrap && cd /tmp/wrap
          # Gradle 9 doi thu muc phai co file settings -> tao file rong
          : > settings.gradle.kts
          gradle wrapper --gradle-version 8.14.3 --distribution-type all
          cd "$GITHUB_WORKSPACE"
          cp /tmp/wrap/gradlew android/gradlew
          cp /tmp/wrap/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/
          chmod +x android/gradlew
          echo "--- gradle-wrapper.properties dang dung ---"
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Tao local.properties
        run: |
          FLUTTER_BIN="$(which flutter)"
          FLUTTER_SDK="$(dirname "$(dirname "$FLUTTER_BIN")")"
          {
            echo "flutter.sdk=$FLUTTER_SDK"
            echo "sdk.dir=${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          } > android/local.properties
          cat android/local.properties

      - name: Tai thu vien Flutter
        run: flutter pub get

      - name: Build APK release
        run: |
          set -o pipefail
          # Moi lan build tang versionCode -> Android coi la ban moi hon
          # va cho phep cai de len ban cu ma giu nguyen du lieu.
          BUILD_NO=${{ github.run_number }}
          echo "versionCode = $BUILD_NO"
          flutter build apk --release \
            --build-name=1.0.$BUILD_NO \
            --build-number=$BUILD_NO 2>&1 | tee /tmp/build.log || {
            echo "=================== LOI GRADLE ==================="
            grep -n -B2 -A6 -iE "error|exception|failed|requires|Could not" /tmp/build.log | head -120
            echo "================================================="
            exit 1
          }

      - name: Kiem tra chu ky APK
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          "$JAVA_HOME/bin/keytool" -printcert -jarfile "$APK" | grep -i "SHA-256\|Owner" || true
          echo "Chu ky nay phai GIONG NHAU o moi ban build thi moi cai de duoc."

      - name: Build them ban arm64 (khong bat buoc)
        continue-on-error: true
        run: |
          BUILD_NO=${{ github.run_number }}
          flutter build apk --release --split-per-abi \
            --build-name=1.0.$BUILD_NO --build-number=$BUILD_NO

      - name: Doi ten file cho de nhan biet
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk out/LoveSync-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk out/LoveSync-arm64.apk || true
          ls -lh out

      - name: Tai file APK len Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LoveSync-APK
          path: out/*.apk
          retention-days: 30

      - name: Tao Release de tai truc tiep tren dien thoai
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LoveSync build ${{ github.run_number }}
          files: out/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
