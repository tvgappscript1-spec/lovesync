name: Build LoveSync APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Lay code tu repo
        uses: actions/checkout@v4

      - name: Cai Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cai Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Kiem tra cau truc project
        run: |
          echo "--- pubspec.yaml ---"
          cat pubspec.yaml
          for f in android/settings.gradle.kts android/build.gradle.kts \
                   android/app/build.gradle.kts android/app/src/main/AndroidManifest.xml; do
            [ -f "$f" ] || { echo "::error::Thieu file $f - hay upload day du thu muc android/"; exit 1; }
          done
          echo "Cau truc android/ day du."

      - name: Tao Gradle wrapper (file .jar khong duoc commit)
        run: |
          cd android
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.13 --distribution-type all
          fi
          chmod +x gradlew
          ./gradlew --version

      - name: Tai thu vien Flutter
        run: flutter pub get

      - name: Build APK release
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee /tmp/build.log || {
            echo "=================== LOI GRADLE ==================="
            grep -n -B2 -A6 -iE "error|exception|failed|requires|Could not" /tmp/build.log | head -120
            echo "================================================="
            exit 1
          }

      - name: Build them ban arm64 (khong bat buoc)
        continue-on-error: true
        run: flutter build apk --release --split-per-abi

      - name: Doi ten file cho de nhan biet
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk out/LoveSync-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk out/LoveSync-arm64.apk || true
          ls -lh out

      - name: Tai file APK len Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LoveSync-APK
          path: out/*.apk
          retention-days: 30

      - name: Tao Release de tai truc tiep tren dien thoai
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LoveSync build ${{ github.run_number }}
          files: out/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
